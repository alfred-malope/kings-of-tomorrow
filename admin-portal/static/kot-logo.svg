<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4B942"/>
      <stop offset="1" stop-color="#E0A82E"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00AEEF"/>
      <stop offset="1" stop-color="#0084B5"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="#071426" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#blueGrad)" stroke-width="1.5" opacity="0.5"/>
  <!-- Crown -->
  <path d="M55 58 L62 72 L75 62 L80 78 L100 55 L120 78 L125 62 L138 72 L145 58 L142 82 L58 82 Z" fill="url(#goldGrad)"/>
  <rect x="58" y="82" width="84" height="4" fill="url(#goldGrad)" rx="1"/>
  <!-- K.O.T text -->
  <text x="100" y="120" font-family="'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">K.O.T</text>
  <!-- Stars -->
  <circle cx="70" cy="138" r="2" fill="#00AEEF"/>
  <circle cx="100" cy="134" r="2.5" fill="#F4B942"/>
  <circle cx="130" cy="138" r="2" fill="#00AEEF"/>
  <!-- FC text -->
  <text x="100" y="158" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="url(#blueGrad)" text-anchor="middle" letter-spacing="3">FC</text>
  <!-- Bottom banner -->
  <rect x="60" y="168" width="80" height="2" fill="url(#blueGrad)" opacity="0.6"/>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="7" font-weight="600" fill="#C9D0D8" text-anchor="middle" letter-spacing="2">EST. 2025</text>
</svg>
