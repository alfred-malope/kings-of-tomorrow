[build]
  command = "npm run build"
  publish = "build"
  environment = [
    "PUBLIC_FIREBASE_API_KEY",
    "PUBLIC_FIREBASE_APP_ID",
    "PUBLIC_FIREBASE_AUTH_DOMAIN",
    "PUBLIC_FIREBASE_MESSAGING_SENDER_ID",
    "PUBLIC_FIREBASE_PROJECT_ID",
    "PUBLIC_FIREBASE_STORAGE_BUCKET",
    "PUBLIC_FIREBASE_USE_EMULATOR",
    "FIREBASE_SERVICE_ACCOUNT"
  ]

# The catch-all redirect to the SvelteKit Netlify function handler is defined in
# static/_redirects. adapter-netlify rejects redirect rules in netlify.toml and
# requires them in a _redirects file.
